name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  PLUGIN_DIR: SkinKit

jobs:
  lint:
    name: Lint and Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Lint plugin source
        run: ruff check $PLUGIN_DIR/
      - name: Validate metadata.txt
        run: |
          if [ ! -f $PLUGIN_DIR/metadata.txt ]; then
            echo "::error file=$PLUGIN_DIR/metadata.txt::$PLUGIN_DIR/metadata.txt not found"
            exit 1
          fi
          grep -q "^name=" $PLUGIN_DIR/metadata.txt \
            || echo "::warning file=$PLUGIN_DIR/metadata.txt::Missing 'name'"
          grep -q "^version=" $PLUGIN_DIR/metadata.txt \
            || echo "::warning file=$PLUGIN_DIR/metadata.txt::Missing 'version'"
          grep -q "^qgisMinimumVersion=" $PLUGIN_DIR/metadata.txt \
            || echo "::warning::Missing 'qgisMinimumVersion'"
          grep -q "^description=" $PLUGIN_DIR/metadata.txt \
            || echo "::warning::Missing 'description'"
          echo "metadata.txt validation complete"

  package:
    name: Package check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check zip builds
        run: |
          if [ -f package.py ]; then
            python package.py
            echo "Package built successfully"
          else
            cd $PLUGIN_DIR && zip -r ../$PLUGIN_DIR.zip . && cd ..
            echo "Zipped plugin directory"
          fi
      - name: Verify zip structure
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then
            echo "::error::No zip file produced"
            exit 1
          fi
          echo "Zip: $ZIP"
          unzip -l "$ZIP" | head -5
          unzip -l "$ZIP" | grep -q "metadata.txt" \
            && echo "metadata.txt found in zip" \
            || echo "::error::metadata.txt not in zip"

  qgis-compat:
    name: QGIS ${{ matrix.qgis_version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        qgis_version:
          - "3.22-focal"
          - "stable"
          - "4.2-trixie"
          - "latest"
    steps:
      - uses: actions/checkout@v7
      - name: Test plugin in QGIS ${{ matrix.qgis_version }}
        run: |
          cat > /tmp/test_plugin.py << 'PYEOF'
          import importlib
          import os
          import subprocess
          import sys

          plugin_dir = os.environ["PLUGIN_DIR"]
          plugin_path = os.path.join("/plugin", plugin_dir)
          # Add the parent of the plugin directory, not the plugin dir itself,
          # so importlib.import_module("SkinKit") finds SkinKit/__init__.py
          sys.path.insert(0, os.path.dirname(plugin_path))

          # --- QGIS and Qt version info ---
          try:
              from qgis.core import Qgis
              print(f"QGIS version: {Qgis.QGIS_VERSION}")
              print(f"QGIS dev version: {Qgis.QGIS_DEV_VERSION}")
              print(f"QGIS release name: {Qgis.QGIS_RELEASE_NAME}")
          except Exception as e:
              print(f"WARNING: could not read QGIS version: {e}")

          try:
              from qgis.PyQt.QtCore import QT_VERSION_STR, PYQT_VERSION_STR
              print(f"Qt version: {QT_VERSION_STR}")
              print(f"PyQt version: {PYQT_VERSION_STR}")
          except Exception as e:
              print(f"WARNING: could not read Qt version: {e}")

          # --- Hard-failing import check ---
          try:
              mod = importlib.import_module(plugin_dir)
              print(f"Plugin loaded: {mod}")
          except Exception as e:
              print(f"::error::Plugin import failed: {e}")
              sys.exit(1)

          # --- classFactory + lifecycle validation ---
          required_attrs = ["classFactory", "metadata", "name"]
          missing = [a for a in required_attrs if not hasattr(mod, a)]
          if missing:
              print(f"::error::Missing required plugin attributes: {missing}")
              sys.exit(1)

          for attr in required_attrs:
              val = getattr(mod, attr)
              print(f"  Has {attr}: {val}")

          # If classFactory is callable, try invoking it with a dummy iface
          if callable(mod.classFactory):
              try:
                  class FactoryIface:
                      def __init__(self):
                          self.mainWindow = lambda: None
                  iface = FactoryIface()
                  plugin_instance = mod.classFactory(iface)
                  if plugin_instance is not None:
                      # Check initGui / unload lifecycle
                      if hasattr(plugin_instance, "initGui"):
                          print(f"  initGui: callable={callable(plugin_instance.initGui)}")
                      if hasattr(plugin_instance, "unload"):
                          print(f"  unload: callable={callable(plugin_instance.unload)}")
                  print(f"  classFactory returned: {plugin_instance}")
              except Exception as e:
                  print(f"::warning::classFactory invocation raised: {e}")
          else:
              print(f"  classFactory is not callable")

          print("All QGIS compatibility checks passed")
          PYEOF

          docker run --rm \
            -v $PWD:/plugin \
            -e PLUGIN_DIR=$PLUGIN_DIR \
            -e QT_QPA_PLATFORM=offscreen \
            -v /tmp/test_plugin.py:/test_plugin.py \
            qgis/qgis:${{ matrix.qgis_version }} \
            sh -c "
              set -e
              if [ ! -d \"/plugin/\$PLUGIN_DIR\" ]; then
                echo \"::error::Plugin dir /plugin/\$PLUGIN_DIR not found\"
                ls /plugin/
                exit 1
              fi
              mkdir -p /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins
              ln -s /plugin/\$PLUGIN_DIR /root/.local/share/QGIS/QGIS3/profiles/default/python/plugins/\$PLUGIN_DIR
              echo '=== Plugin import test ==='
              python3 /test_plugin.py
              if [ -d /plugin/tests ]; then
                echo ''
                echo '=== Running tests in QGIS \${{ matrix.qgis_version }} ==='
                cd /plugin
                python3 -m pytest tests/ -v --tb=short -p no:cacheprovider \
                  || echo '::warning::Some tests failed in QGIS \${{ matrix.qgis_version }}'
              else
                echo 'No tests/ directory - import check only'
              fi
            "
