name: Socket

on:
  pull_request:
    paths:
      - '**/package.json'
      - '**/package-lock.json'
      - '**/pyproject.toml'
      - '**/requirements*.txt'

jobs:
  socket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: SocketDev/action@v1.3.2
        with:
          mode: firewall-free
      - name: Install dependencies through firewall
        run: sfw pip install ruff
